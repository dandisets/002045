description: 'Data from "Separating and combining motor memories with training order."
  Jae-Hyun Kim, Wei Nora Zhang, Nuo Li. Nat Neurosci 2026  Electrophysiology data
  from anterior lateral motor cortex in the mouse across two tasks. Mice performed
  directional tongue movements (lick left or lick right) under two distinct task contexts.
  In the tactile context, lick direction was instructed by the position of a pole
  stimulus delivered to the whiskers (anterior for lick left; posterior for lick right).
  In the auditory context, lick direction was instructed by the frequency of a pure
  tone (2 kHz for lick left; 10 kHz for lick right). Data from two cohorts of mice
  were trained to perform these two tasks with different currculum - blocked versus
  interleaved.  This work was funded by NIH NS131229, NS132025, NS142432, Simons Collaboration
  on the Global Brain, and PEW Innovation Fund. '
